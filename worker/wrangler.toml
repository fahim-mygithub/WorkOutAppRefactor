name = "workout-ai"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (set with `wrangler secret put`, never committed):
#   ANTHROPIC_API_KEY  - the Anthropic API key
#   AI_ALLOWED_EMAILS  - comma-separated emails allowed to use AI
[vars]
FIREBASE_PROJECT_ID = "workout-pwa-nf0sf"
ALLOWED_ORIGINS = "https://fahim-mygithub.github.io,https://workout-pwa-nf0sf.web.app,https://workout-pwa-nf0sf.firebaseapp.com,http://localhost:5290"
APP_ORIGIN = "https://fahim-mygithub.github.io/"
# 0 turns AI off for everyone.
AI_DAILY_LIMIT = "150"

[[kv_namespaces]]
binding = "AI_USAGE"
id = "REPLACE_AT_DEPLOY"
