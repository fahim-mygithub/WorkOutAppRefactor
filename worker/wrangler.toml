name = "workout-ai"
# src/main.ts routes /mcp, the OAuth endpoints and /.well-known/* to the Claude
# connector, and everything else to the AI Worker (src/index.ts) unchanged.
main = "src/main.ts"
compatibility_date = "2026-09-01"
# global_fetch_strictly_public: lets the OAuth provider fetch Client ID
# Metadata Documents (how newer MCP clients identify themselves).
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Secrets (set with `wrangler secret put`, never committed):
#   ANTHROPIC_API_KEY         - the Anthropic API key
#   AI_ALLOWED_EMAILS         - comma-separated emails allowed to use AI and the Claude connector
#   FIREBASE_SERVICE_ACCOUNT  - the Firebase service-account JSON key (the whole file), used by the
#                               connector to read/write Firestore. It bypasses security rules: the
#                               Worker scopes every path to the signed-in user's uid itself.
[vars]
FIREBASE_PROJECT_ID = "workout-pwa-nf0sf"
ALLOWED_ORIGINS = "https://fahim-mygithub.github.io,https://workout-pwa-nf0sf.web.app,https://workout-pwa-nf0sf.firebaseapp.com,http://localhost:5290"
APP_ORIGIN = "https://fahim-mygithub.github.io/"
# 0 turns AI off for everyone.
AI_DAILY_LIMIT = "150"
# Public Firebase web config (same values as src/firebase/config.ts) for the
# connector's Google sign-in page at /authorize.
FIREBASE_WEB_API_KEY = "AIzaSyCh2sOBBYE7MEwZHn56C-U-05YPJeu1Bts"
FIREBASE_AUTH_DOMAIN = "workout-pwa-nf0sf.firebaseapp.com"

[[kv_namespaces]]
binding = "AI_USAGE"
id = "c18a66f0897d469eab1b86cf8ae4bd18"

# OAuth clients, grants and tokens for the Claude connector
# (`npx wrangler kv namespace create OAUTH_KV`, paste the id here).
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "205b4a8fcaf54c728458f43b91d059a1"

# Cloudflare R2 bucket for exercise media (photos, GIFs, videos)
[[r2_buckets]]
binding = "EXERCISE_MEDIA"
bucket_name = "workout-media"
